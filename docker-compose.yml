name: markflux

x-service: &service
  restart: unless-stopped
  labels:
    logging: alloy

x-java-env: &java-env
  SPRING_MAIN_BANNER_MODE: "off"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
  JWT_SECRET: markflux-dev-secret-key-change-in-production

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 30s

services:
  postgres:
    <<: *service
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: markflux
      POSTGRES_PASSWORD: markflux
    ports: [ "5432:5432" ]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U markflux" ]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    <<: *service
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: [ "9094:9094" ]
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  kafka-ui:
    <<: *service
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: markflux
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: [ "8090:8080" ]
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    <<: *service
    image: redis:8.8.2-alpine
    command: [ "redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru" ]
    ports: [ "6379:6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    <<: *service
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
    ports: [ "9090:9090" ]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  tempo:
    <<: *service
    image: grafana/tempo:2.10.8
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    ports: [ "3200:3200", "4317:4317", "4318:4318" ]
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  loki:
    <<: *service
    image: grafana/loki:3.7.8
    command: [ "-config.file=/etc/loki/loki.yml" ]
    ports: [ "3100:3100" ]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    <<: *service
    image: grafana/alloy:v1.19.2
    command: [ "run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy" ]
    ports: [ "12345:12345" ]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [ loki ]

  grafana:
    <<: *service
    image: grafana/grafana:12.4.11
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports: [ "3000:3000" ]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [ prometheus, loki, tempo ]

  api-gateway:
    <<: *service
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: markflux/api-gateway
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      PRODUCT_SERVICE_URL: http://product-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      CART_SERVICE_URL: http://cart-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
    ports: [ "8080:8080" ]
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null || exit 1" ]
    depends_on:
      redis:
        condition: service_healthy

  product-service:
    <<: *service
    build:
      context: .
      dockerfile: product-service/Dockerfile
    image: markflux/product-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/product_db
      REDIS_HOST: redis
    ports: [ "8081:8081" ]
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health > /dev/null || exit 1" ]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  inventory-service:
    <<: *service
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    image: markflux/inventory-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
    ports: [ "8082:8082" ]
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health > /dev/null || exit 1" ]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  cart-service:
    <<: *service
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    image: markflux/cart-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/cart_db
      PRODUCT_SERVICE_URL: http://product-service:8081
    ports: [ "8083:8083" ]
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health > /dev/null || exit 1" ]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-service:
    <<: *service
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: markflux/order-service
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      CART_SERVICE_URL: http://cart-service:8083
      PRODUCT_SERVICE_URL: http://product-service:8081
    ports: [ "8084:8084" ]
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health > /dev/null || exit 1" ]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
