global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: markflux-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - product-service:8081
          - inventory-service:8082
          - cart-service:8083
          - order-service:8084

  - job_name: tempo
    static_configs:
      - targets: [ "tempo:3200" ]
