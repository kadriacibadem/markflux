spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 10s
          metrics:
            enabled: true
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userOrIpKeyResolver}"
          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/products/**,/api/categories/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: product-service
                    fallbackUri: forward:/fallback/product-service
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/inventory/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: inventory-service
                    fallbackUri: forward:/fallback/inventory-service
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/cart/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: cart-service
                    fallbackUri: forward:/fallback/cart-service
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: order-service
                    fallbackUri: forward:/fallback/order-service
            - id: product-service-api-docs
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api-docs/product-service
              filters:
                - SetPath=/v3/api-docs
            - id: inventory-service-api-docs
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api-docs/inventory-service
              filters:
                - SetPath=/v3/api-docs
            - id: cart-service-api-docs
              uri: ${CART_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api-docs/cart-service
              filters:
                - SetPath=/v3/api-docs
            - id: order-service-api-docs
              uri: ${ORDER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api-docs/order-service
              filters:
                - SetPath=/v3/api-docs

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    configs:
      default:
        timeout-duration: 11s

server:
  port: 8080

markflux:
  jwt:
    secret: ${JWT_SECRET:markflux-dev-secret-key-change-in-production}
  dev-token:
    enabled: false
    ttl: 1h

springdoc:
  swagger-ui:
    urls:
      - name: product-service
        url: /api-docs/product-service
      - name: inventory-service
        url: /api-docs/inventory-service
      - name: cart-service
        url: /api-docs/cart-service
      - name: order-service
        url: /api-docs/order-service
      - name: api-gateway
        url: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  observations:
    enable:
      spring.security: false
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

